name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Syntax check as a module, ASCII check, and the browser tests in
      # headless Chrome (preinstalled on the runner, as are Node and Python).
      - name: Tests
        run: CHROME=$(command -v google-chrome) bash tests/run.sh
